# Server Configuration
server.port=8085

# Spring Application
spring.application.name=sizzlo-backend

# Datasource (Isolated Local Persistent Database - does not touch external servers or other projects)
spring.datasource.url=jdbc:h2:file:./data/sizzlodb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.mvc.pathmatch.matching-strategy=ant-path-matcher
spring.jackson.serialization.fail-on-empty-beans=false

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS Settings
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:8081,*

# WhatsApp OTP Configuration
whatsapp.otp.app-key=${APP_KEY:6e2ba3ab-d783-4c4c-8242-e45b19025de3}
whatsapp.otp.auth-key=${AUTH_KEY:ZvY1dxfHobOPNjPB2EDmTW3ZYsXXd4nunuTjMTW6HChlF3EpkG}
whatsapp.otp.api-url=${API_URL:https://app.justwedding.in/api/create-message}
whatsapp.otp.template-id=${TEMPLATE_ID:otp_send_general_whatsapp}
whatsapp.otp.ttl-minutes=${OTP_TTL_MINUTES:10}
whatsapp.otp.enabled=${WHATSAPP_OTP_ENABLED:true}

