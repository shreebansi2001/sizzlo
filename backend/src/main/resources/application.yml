server:
  port: 8080

spring:
  application:
    name: sizzlo-backend
  datasource:
    url: jdbc:h2:mem:sizzlodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173,http://localhost:8081,*"
