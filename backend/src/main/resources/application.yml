server:
  port: 8080

spring:
  application:
    name: sizzlo-backend
  datasource:
    url: jdbc:h2:mem:sizzlodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

app:
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:5173,http://localhost:8081,*"

whatsapp:
  otp:
    app-key: ${APP_KEY:6e2ba3ab-d783-4c4c-8242-e45b19025de3}
    auth-key: ${AUTH_KEY:ZvY1dxfHobOPNjPB2EDmTW3ZYsXXd4nunuTjMTW6HChlF3EpkG}
    api-url: ${API_URL:https://app.justwedding.in/api/create-message}
    template-id: ${TEMPLATE_ID:otp_send_general_whatsapp}
    ttl-minutes: ${OTP_TTL_MINUTES:10}
    enabled: ${WHATSAPP_OTP_ENABLED:true}

